name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check

  publish:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure Alibaba Cloud CLI tools
        uses: yizhoumo/setup-ossutil@v2
        with:
          ossutil-version: '1.7.19'
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Publish production files
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          if [ -z "$OSS_BUCKET" ]; then
            echo "Repository secret OSS_BUCKET is not configured"
            exit 1
          fi
          ossutil sync ./dist/ "oss://${OSS_BUCKET}/" -f --delete --exclude ".git*"
